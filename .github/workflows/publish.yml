name: Publish

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-rust:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Run native workspace tests before publish
        run: cargo test --workspace --no-default-features --locked

      - name: Run publish-readiness gate
        run: bash scripts/check_crate_publish_ready.sh

      - name: Publish Rust crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: bash scripts/publish_crates.sh

  build-node-prebuilds:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    name: Node prebuild (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            # The cross musl toolchain has no dynamic libgcc_s; link it statically.
            rustflags: "-C link-arg=-static-libgcc"
          - os: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/ferrugo-node/package-lock.json

      - name: Install musl tools
        if: ${{ contains(matrix.target, 'musl') && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Node binding dependencies
        working-directory: crates/ferrugo-node
        run: npm ci

      - name: Build Node prebuild
        working-directory: crates/ferrugo-node
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: npm run build -- --target ${{ matrix.target }}

      - name: Upload Node prebuild
        uses: actions/upload-artifact@v5
        with:
          name: node-prebuild-${{ matrix.target }}
          path: crates/ferrugo-node/*.node
          if-no-files-found: error

  publish-node:
    needs:
      - release-please
      - build-node-prebuilds
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm trusted publishing (OIDC), mirroring the crates.io publish job.
      # Requires the GitHub Actions trusted publisher to be configured for the
      # `ferrugo` package on npmjs.com (repository sebastian-software/ferrugo,
      # workflow publish.yml).
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: crates/ferrugo-node/package-lock.json

      - name: Install Node binding dependencies
        working-directory: crates/ferrugo-node
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Regenerates index.js/index.d.ts from the crate at the released version,
      # so the published loader can never lag behind the package version
      # (release-please bumps package.json but not the generated bindings).
      - name: Regenerate JS bindings at release version
        working-directory: crates/ferrugo-node
        run: npm run build

      - name: Download Node prebuilds
        uses: actions/download-artifact@v6
        with:
          pattern: node-prebuild-*
          path: crates/ferrugo-node
          merge-multiple: true

      - name: Check bundled prebuilds
        working-directory: crates/ferrugo-node
        run: |
          count="$(ls -1 ferrugo.*.node | wc -l)"
          echo "bundled prebuilds: ${count}"
          test "${count}" -ge 7

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships a current npm,
      # but pin the floor explicitly so runner image drift cannot break OIDC.
      - name: Check npm version supports trusted publishing
        run: |
          npm --version
          node -e "const [major, minor, patch] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)"

      - name: Publish Node package
        working-directory: crates/ferrugo-node
        run: npm publish --access public --ignore-scripts
