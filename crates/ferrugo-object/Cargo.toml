[package]
name = "ferrugo-object"
version = "0.3.1"
edition.workspace = true
description = "PDF object graph, xref, and stream decoding for Ferrugo."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["pdf", "object", "xref", "parser"]
include = ["src/**", "Cargo.toml", "README.md"]

[dependencies]
aes = { version = "0.8.4", default-features = false }
cbc = { version = "0.1.2", default-features = false, features = ["alloc", "block-padding"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
ferrugo-syntax = { version = "0.3.1", path = "../ferrugo-syntax" }
md-5 = { version = "0.10.6", default-features = false }
rc4 = { version = "0.1.0", default-features = false }
sha2 = { version = "0.10.8", default-features = false }

[package.metadata.docs.rs]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
