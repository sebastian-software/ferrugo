[package]
name = "ferrugo-node"
version = "0.5.0"
edition.workspace = true
description = "Node-API bindings for Ferrugo native PDF thumbnails."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["pdf", "thumbnail", "node", "napi"]
publish = false
include = ["src/**", "Cargo.toml", "README.md", "build.rs", "package.json", "index.js", "index.d.ts"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferrugo-native = { version = "0.5.0", path = "../ferrugo-native" }
ferrugo-thumbnail = { version = "0.5.0", path = "../ferrugo-thumbnail" }
napi = "3.3.0"
napi-derive = "3.2.5"

[build-dependencies]
napi-build = "2.2.3"

[lints]
workspace = true
